<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Illustratie porie — Huidzorg Mozi</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="css/mozi.css">
<style>
  .proef{max-width:720px;margin:0 auto;padding:40px var(--gutter) 80px}
  .kader{border-radius:var(--r-media);overflow:hidden;aspect-ratio:4/3.2;background:var(--surface)}
  .kader svg{width:100%;height:100%;display:block}
</style>
</head>
<body>
<div class="preview-note">Illustratie "wat is acne" &middot; <a href="./">terug naar home</a></div>
<div class="proef">
  <div class="kader"><svg class="porie" viewBox="0 0 600 480" role="img" aria-label="Doorsnede van de huid: links een gezonde porie waar talg vrij naar buiten loopt, rechts een porie die verstopt is met talg en afgestorven huidcellen, met een ontsteking eromheen">
  <defs>
    <radialGradient id="po-ontsteking" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4806B" stop-opacity=".40"/>
      <stop offset="60%" stop-color="#D4806B" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#D4806B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="480" fill="#F9F7F6"/>

  <rect y="188" width="600" height="220" fill="#F1DACB"/>
  <rect y="404" width="600" height="76" fill="#F7E8DD"/>
  <g fill="#EFD9C9"><circle cx="56" cy="448" r="21"/><circle cx="124" cy="462" r="16"/><circle cx="492" cy="450" r="23"/><circle cx="560" cy="466" r="15"/></g>
  <path d="M0,122 C120,116 200,126 300,120 S470,114 600,122 L600,206 C470,200 380,212 300,206 S120,200 0,210 Z" fill="#E7C9B4"/>

  <!-- links: gezonde porie -->
  <path d="M159,120 C163,142 167,150 167,166 L167,278 Q167,292 180,292 Q193,292 193,278 L193,166 C193,150 197,142 201,120 Z" fill="#FBF3EA" stroke="#C98A7A" stroke-width="1.5"/>
  <g fill="#F7E8DD" stroke="#C98A7A" stroke-width="1.5">
      <ellipse cx="161" cy="300" rx="19" ry="16"/>
      <ellipse cx="199" cy="300" rx="19" ry="16"/>
      <ellipse cx="180" cy="312.8" rx="17" ry="13.6"/>
    </g>
  <g fill="#E8D3B2"><circle cx="180" cy="268" r="4"/><circle cx="178" cy="242" r="3.4"/><circle cx="182" cy="216" r="2.8"/><circle cx="180" cy="190" r="2.4"/></g>
  <path d="M180,290 C178,244 182,182 180,122 C179,106 176,96 171,88" fill="none" stroke="#1C1B19" stroke-width="1.7" stroke-linecap="round"/>

  <!-- rechts: verstopte porie -->
  <circle cx="418" cy="160" r="112" fill="url(#po-ontsteking)"/>
  <path d="M390,120 C394,142 394,150 394,166 L394,278 Q394,292 418,292 Q442,292 442,278 L442,166 C442,150 442,142 446,120 Z" fill="#E8D3B2" stroke="#C98A7A" stroke-width="1.5"/>
  <g fill="#F7E8DD" stroke="#C98A7A" stroke-width="1.5">
      <ellipse cx="394" cy="300" rx="24" ry="21"/>
      <ellipse cx="442" cy="300" rx="24" ry="21"/>
      <ellipse cx="418" cy="316.8" rx="22" ry="17.849999999999998"/>
    </g>
  <g fill="#C98A7A" opacity=".55"><circle cx="411" cy="214" r="2.4"/><circle cx="426" cy="232" r="2.4"/><circle cx="413" cy="252" r="2.4"/><circle cx="427" cy="270" r="2.4"/></g>
  <path d="M398,152 C398,134 438,134 438,152 Z" fill="#C7A379"/>
  <path d="M394,121 C396,99 440,99 442,121 Z" fill="#E3A08B" stroke="#C98A7A" stroke-width="1.5"/>
  <ellipse cx="418" cy="105" rx="7" ry="4.5" fill="#E8D3B2" opacity=".9"/>

  <text class="lab" x="180" y="54" text-anchor="middle">GEZONDE PORIE</text>
   <text class="cap cap-lang" x="180" y="80" text-anchor="middle">talg loopt vrij naar buiten</text>
   <text class="cap cap-kort" x="180" y="82" text-anchor="middle">talg loopt vrij</text>
  <text class="lab" x="418" y="54" text-anchor="middle">VERSTOPTE PORIE</text>
   <text class="cap cap-lang" x="418" y="80" text-anchor="middle">talg hoopt zich op en ontsteekt</text>
   <text class="cap cap-kort" x="418" y="82" text-anchor="middle">talg hoopt op</text>
</svg></div>
</div>
</body>
</html>
