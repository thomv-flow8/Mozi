# Pages CMS — beheeromgeving voor Emine (https://app.pagescms.org)
# Elke wijziging wordt een commit op main; GitHub bouwt en publiceert de site daarna automatisch.
# Schuingedrukt in koppen: zet het woord tussen sterretjes, bijv. "SkinPen *microneedling*".

media:
  input: assets          # map in de repository
  output: ../assets      # zo staat het pad in de databestanden
  path: assets/web       # nieuwe uploads komen hier
  extensions: [jpg, jpeg, png, webp]

content:
  # ---------------------------------------------------------------- Homepage
  - name: home
    label: Homepage
    description: "Teksten en foto's van de homepage. In koppen wordt een woord tussen sterretjes schuingedrukt en maak je met Enter een nieuwe regel."
    type: file
    path: docs/home.json
    fields:
      - { name: _bron, label: Bron, type: string, hidden: true }
      - name: aankondiging
        label: Balk bovenaan (staat op elke pagina)
        type: object
        fields:
          - { name: tekst, label: Tekst, type: string }
          - { name: knop, label: Linktekst (opent de agenda), type: string }
      - name: opening
        label: Opening
        type: object
        fields:
          - { name: label, label: Kleine tekst boven de kop, type: string }
          - { name: kop, label: Kop, type: text, description: "Schuingedrukt: woord tussen sterretjes. Nieuwe regel: Enter." }
          - { name: tekst, label: Tekst, type: text }
          - { name: knopAfspraak, label: Knop afspraak maken, type: string }
          - { name: knopBehandelingen, label: Knop naar de behandelingen, type: string }
          - name: cijfers
            label: Cijfers onder de knoppen
            type: object
            list: { max: 4, collapsible: { collapsed: true, summary: "{waarde} — {label}" } }
            fields:
              - { name: waarde, label: Waarde, type: string }
              - { name: label, label: Omschrijving, type: string }
          - { name: portret, label: Portret, type: image }
          - { name: portretAlt, label: Beschrijving van het portret, type: string, description: "Voor schermlezers en Google" }
          - { name: naam, label: Naam bij het portret, type: string }
          - { name: functie, label: Functie bij het portret, type: string }
      - name: behandelingen
        label: Behandelingen
        type: object
        fields:
          - { name: label, label: Kleine tekst boven de kop, type: string }
          - { name: kop, label: Kop, type: text, description: "Schuingedrukt: woord tussen sterretjes. Nieuwe regel: Enter." }
          - { name: tekst, label: Tekst, type: text }
          - name: kaarten
            label: Kaarten
            type: object
            list: { collapsible: { collapsed: true, summary: "{titel} — {prijs}" } }
            fields:
              - { name: titel, label: Titel, type: string, required: true }
              - { name: tekst, label: Tekst, type: text }
              - { name: prijs, label: Prijs, type: string, description: "Bijv. vanaf € 75, € 25 of op aanvraag. Met 'vanaf' ervoor wordt alleen het bedrag vet." }
              - { name: beeld, label: Foto, type: image }
              - { name: uitsnede, label: Uitsnede van de foto (optioneel), type: string, description: "Leeg = midden van de foto. Bijv. 50% 20% laat meer van de bovenkant zien." }
              - name: pagina
                label: Behandelpagina
                type: select
                options:
                  values:
                    - { value: acne, label: "Acnetherapie" }
                    - { value: rosacea, label: "Rosacea & couperose" }
                    - { value: huidverhevenheden, label: "Huidverhevenheden" }
                    - { value: peelings, label: "Medische peelings" }
                    - { value: skinpen, label: "SkinPen microneedling" }
                    - { value: combinatie, label: "Combinatiebehandelingen" }
                    - { value: huidverbetering, label: "Huidverbetering" }
                    - { value: ontharen, label: "Laserontharing" }
                    - { value: laser, label: "Laser bij vaatjes & pigment" }
                    - { value: led, label: "LED-therapie Lumi8" }
                    - { value: schimmelnagels, label: "Schimmelnagels" }
                    - { value: productadvies, label: "Huidanalyse & productadvies" }
              - name: categorie
                label: Categorie (voor de filterknoppen)
                type: select
                options:
                  values:
                    - { value: huidproblemen, label: Huidproblemen }
                    - { value: verjonging, label: "Huidverbetering & verjonging" }
                    - { value: laser, label: "Laser & licht" }
                    - { value: overig, label: Advies }
              - { name: klachten, label: Huidklachten (voor het zoeken op klacht), type: string, list: true }
      - name: werkwijze
        label: Zo werkt het
        type: object
        fields:
          - { name: label, label: Kleine tekst boven de kop, type: string }
          - { name: kop, label: Kop, type: text, description: "Schuingedrukt: woord tussen sterretjes. Nieuwe regel: Enter." }
          - name: stappen
            label: Stappen (de animaties eronder liggen vast)
            type: object
            list: { min: 3, max: 3, collapsible: { collapsed: true, summary: "{titel}" } }
            fields:
              - { name: titel, label: Titel, type: string }
              - { name: tekst, label: Tekst, type: text }
      - name: contact
        label: Contact
        type: object
        fields:
          - { name: label, label: Kleine tekst boven de kop, type: string }
          - { name: kop, label: Kop, type: text, description: "Schuingedrukt: woord tussen sterretjes. Nieuwe regel: Enter." }
          - { name: tekst, label: Tekst, type: text }
          - { name: knop, label: Knop (opent de agenda), type: string }
          - { name: locatie, label: Locatie, type: string }
          - { name: adres, label: Adres, type: string, description: "Wordt ook de link naar Google Maps" }
          - { name: telefoon, label: Telefoonnummer, type: string, description: "Bijv. 06 27 26 27 31" }
          - { name: telefoonTekst, label: Tekst onder het telefoonnummer, type: string }
          - { name: email, label: E-mailadres, type: string }
          - { name: emailTekst, label: Tekst onder het e-mailadres, type: string }
          - { name: instagram, label: Instagram-naam (zonder @), type: string }
          - { name: instagramTekst, label: Tekst onder Instagram, type: string }

  # ---------------------------------------------------------------- Tarieven
  - name: tarieven
    label: Tarieven
    description: Alle prijzen. Wijzigingen verschijnen op de tarievenpagina én op de behandelpagina's.
    type: file
    path: docs/tarieven.json
    fields:
      - { name: _bron, label: Bron, type: string, hidden: true }
      - name: groepen
        label: Categorieën
        type: object
        list:
          collapsible: { collapsed: true, summary: "{naam}" }
        fields:
          - { name: id, label: ID, type: string, hidden: true }
          - { name: naam, label: Naam categorie, type: string, required: true }
          - { name: pagina, label: Behandelpagina, type: string, hidden: true }
          - { name: intro, label: Korte omschrijving, type: string }
          - name: rijen
            label: Tarieven
            type: object
            list:
              collapsible: { collapsed: true, summary: "{naam} — {prijs}" }
            fields:
              - { name: naam, label: Behandeling, type: string, required: true }
              - { name: info, label: Toelichting (optioneel), type: string }
              - { name: prijs, label: Prijs, type: string, required: true, description: "Bijv. € 75, vanaf € 100, gratis of op aanvraag" }
              - { name: zones, label: Zones op de lichaamskaart (laserontharing), type: string, list: true, hidden: true }
              - { name: keuze, label: Keuze i.p.v. combinatie, type: boolean, hidden: true }

  # ---------------------------------------------------------------- Producten
  - name: producten
    label: Merken & producten
    description: De merken en de producten in het webshopblok op de homepage.
    type: file
    path: docs/producten.json
    fields:
      - { name: _bron, label: Bron, type: string, hidden: true }
      - name: merken
        label: Merken
        type: object
        list:
          collapsible: { collapsed: true, summary: "{naam}" }
        fields:
          - { name: id, label: ID, type: string, hidden: true }
          - { name: naam, label: Naam, type: string, required: true }
          - { name: logo, label: Logo, type: image }
          - { name: hoog, label: Logo hoger tonen (vierkant logo), type: boolean }
          - { name: tekst, label: Eén zin over het merk, type: string }
      - name: producten
        label: Producten
        type: object
        list:
          collapsible: { collapsed: true, summary: "{merk} {naam} — {prijs}" }
        fields:
          - { name: id, label: ID, type: string, hidden: true }
          - { name: merk, label: Merk, type: string, required: true }
          - { name: naam, label: Naam, type: string, required: true }
          - { name: ondertitel, label: Soort product, type: string, description: "Bijv. Reinigingsschuim of Nachtverzorging" }
          - { name: inhoud, label: Inhoud, type: string, description: "Bijv. 200 ml" }
          - { name: prijs, label: Prijs, type: string, description: "Bijv. € 16,30" }
          - { name: tag, label: Label op de foto, type: string, description: "Bijv. Bij acne of Anti-aging" }
          - { name: beeld, label: Productfoto, type: image, description: "Liefst uitgesneden, zonder achtergrond" }
          - { name: kort, label: Korte omschrijving, type: text }
          - { name: punten, label: Eigenschappen, type: string, list: true }
          - { name: huidtype, label: Voor welke huid, type: string }
          - { name: gebruik, label: Gebruik, type: text }

  # ---------------------------------------------------------------- Behandelingen
  - name: behandelingen
    label: Behandelingen
    description: De twaalf behandelpagina's. Prijzen staan bij Tarieven.
    type: file
    path: docs/behandelingen.json
    fields:
      - { name: _bron, label: Bron, type: string, hidden: true }
      - name: behandelingen
        label: Behandelingen
        type: object
        list:
          collapsible: { collapsed: true, summary: "{titel}" }
        fields:
          - { name: slug, label: Adres (niet wijzigen), type: string, hidden: true }
          - { name: titel, label: Titel, type: string, required: true }
          - { name: paginaKop, label: Kop bovenaan, type: string, description: "Schuingedrukt deel tussen sterretjes, bijv. SkinPen *microneedling*" }
          - { name: kort, label: Korte naam in zinnen, type: string, description: "Voor 'Wat kost …?' en 'Waar … helpt'" }
          - name: categorie
            label: Categorie
            type: select
            options: { values: ["Huidproblemen", "Huidverbetering & verjonging", "Laser & licht", "Advies"] }
          - { name: omschrijving, label: Omschrijving voor Google, type: text }
          - { name: intro, label: Intro, type: text }
          - { name: beeld, label: Hoofdfoto, type: image }
          - { name: logo, label: Logo merk/apparaat (optioneel), type: image }
          - { name: logoTekst, label: Tekst bij logo, type: string }
          - name: feiten
            label: Kerngegevens (4 blokjes)
            type: object
            list: { max: 4, collapsible: { collapsed: true, summary: "{waarde} — {label}" } }
            fields:
              - { name: waarde, label: Waarde, type: string }
              - { name: label, label: Omschrijving, type: string }
          - name: secties
            label: Uitleg (blokken met tekst en beeld)
            type: object
            list: { collapsible: { collapsed: true, summary: "{eyebrow}" } }
            fields:
              - { name: id, label: ID, type: string, hidden: true }
              - { name: eyebrow, label: Kleine kop, type: string }
              - { name: kop, label: Kop, type: string, description: "Schuingedrukt tussen sterretjes" }
              - { name: tekst, label: Alinea's, type: text, list: true }
              - name: visual
                label: Beeld
                type: object
                fields:
                  - name: type
                    label: Soort
                    type: select
                    description: "foto = afbeelding, kaart = tekstkaart met punten, en de tekeningen: huidlagen (microneedling), porie (acne), haarzakje (ontharen), licht (LED), wratje (huidverhevenheden), vaatje (laser), nagel (schimmelnagels)"
                    options: { values: ["foto", "kaart", "huidlagen", "porie", "haarzakje", "licht", "wratje", "vaatje", "nagel"] }
                  - { name: src, label: Foto (bij soort foto), type: image }
                  - { name: alt, label: Beschrijving van de foto, type: string }
                  - name: pas
                    label: Weergave foto
                    type: select
                    description: "leeg = beeldvullend; heel = uitgesneden apparaat of product in zijn geheel op een zandvlak"
                    options: { values: ["", "heel"] }
                  - { name: titel, label: Kaarttitel (bij soort kaart), type: string, description: "Schuingedrukt tussen sterretjes" }
                  - { name: punten, label: Kaartpunten, type: string, list: true }
          - { name: geschiktBij, label: Geschikt bij, type: string, list: true }
          - name: waarom
            label: Waarom-blok (optioneel)
            type: object
            fields:
              - { name: kop, label: Kop, type: string }
              - name: punten
                label: Punten
                type: object
                list: { collapsible: { collapsed: true, summary: "{titel}" } }
                fields:
                  - { name: titel, label: Titel, type: string }
                  - { name: tekst, label: Tekst, type: text }
          - name: verloop
            label: Verloop (optioneel; leeg = standaard intake → plan → behandeling → thuis)
            type: object
            fields:
              - { name: kop, label: Kop, type: string }
              - name: stappen
                label: Stappen
                type: object
                list: { collapsible: { collapsed: true, summary: "{wanneer}" } }
                fields:
                  - { name: wanneer, label: Moment, type: string }
                  - { name: tekst, label: Tekst, type: text }
          - name: resultaten
            label: Voor/na-resultaten (alleen met schriftelijke toestemming)
            type: object
            list: { collapsible: { collapsed: true, summary: "{naam}" } }
            fields:
              - { name: naam, label: Naam (tabblad), type: string }
              - { name: voor, label: Foto voor, type: image }
              - { name: na, label: Foto na, type: image }
              - name: info
                label: Gegevens
                type: object
                list: true
                fields:
                  - { name: label, label: Label, type: string }
                  - { name: waarde, label: Waarde, type: string }
              - { name: bron, label: Bron/toelichting, type: string }
          - name: tarieven
            label: Tarievencategorie
            type: select
            options: { values: ["intake", "acne", "skinpen", "huidverbetering", "laser", "peelings", "combinatie", "electro", "ontharing"] }
          - { name: lichaamskaart, label: Lichaamskaart tonen bij de tarieven, type: boolean, hidden: true }
          - name: tarievenRijen
            label: Eigen prijsregels (alleen als er geen tarievencategorie is)
            type: object
            list: true
            fields:
              - { name: naam, label: Behandeling, type: string }
              - { name: info, label: Toelichting, type: string }
              - { name: prijs, label: Prijs, type: string }
          - { name: tarievenExtra, label: Tekst onder de prijzen, type: string }
          - name: vragen
            label: Veelgestelde vragen
            type: object
            list: { collapsible: { collapsed: true, summary: "{v}" } }
            fields:
              - { name: v, label: Vraag, type: string }
              - { name: a, label: Antwoord, type: text }
          - name: gerelateerd
            label: Gerelateerde behandelingen
            type: select
            options:
              multiple: true
              values: ["acne", "rosacea", "huidverhevenheden", "peelings", "skinpen", "combinatie", "huidverbetering", "ontharen", "laser", "led", "schimmelnagels", "productadvies"]
          - { name: aanvullen, label: Nog aan te vullen (intern), type: string, list: true }
      - name: kaarten
        label: Kaarten bij 'Gerelateerde behandelingen'
        type: object
        hidden: true
        fields:
          - name: acne
            label: Acne
            type: object
            fields: &kaart
              - { name: titel, label: Titel, type: string }
              - { name: tekst, label: Tekst, type: string }
              - { name: beeld, label: Foto, type: image }
              - { name: prijs, label: Prijs, type: string }
              - { name: cat, label: Categorie, type: string }
          - { name: rosacea, label: Rosacea, type: object, fields: *kaart }
          - { name: huidverhevenheden, label: Huidverhevenheden, type: object, fields: *kaart }
          - { name: schimmelnagels, label: Schimmelnagels, type: object, fields: *kaart }
          - { name: peelings, label: Peelings, type: object, fields: *kaart }
          - { name: skinpen, label: SkinPen, type: object, fields: *kaart }
          - { name: combinatie, label: Combinatie, type: object, fields: *kaart }
          - { name: huidverbetering, label: Huidverbetering, type: object, fields: *kaart }
          - { name: ontharen, label: Ontharen, type: object, fields: *kaart }
          - { name: laser, label: Laser, type: object, fields: *kaart }
          - { name: led, label: LED, type: object, fields: *kaart }
          - { name: productadvies, label: Productadvies, type: object, fields: *kaart }

  # ---------------------------------------------------------------- Over Mozi
  - name: over
    label: Over Mozi
    description: De pagina Over Mozi. In koppen wordt een woord tussen sterretjes schuingedrukt.
    type: file
    path: docs/over.json
    fields:
      - { name: _bron, label: Bron, type: string, hidden: true }
      - { name: kop, label: Kop bovenaan, type: string, description: "Bijv. Over *Mozi*" }
      - { name: intro, label: Intro, type: text }
      - { name: naam, label: Naam, type: string }
      - { name: functie, label: Functie, type: string }
      - { name: citaat, label: Citaat, type: text }
      - { name: verhaalKop, label: Kop boven het verhaal, type: string }
      - { name: verhaal, label: Verhaal (alinea's), type: text, list: true }
      - name: waarden
        label: Waarden (blokjes)
        type: object
        list: { collapsible: { collapsed: true, summary: "{titel}" } }
        fields:
          - name: icoon
            label: Icoon
            type: select
            options:
              values:
                - { value: shield, label: Schild }
                - { value: chat, label: Gesprek }
                - { value: h-flesje, label: Flesje }
                - { value: check, label: Vinkje }
                - { value: star, label: Ster }
                - { value: clock, label: Klok }
                - { value: pin, label: Locatie }
          - { name: titel, label: Titel, type: string }
          - { name: tekst, label: Tekst, type: string }
      - name: aansluitingen
        label: Aansluitingen en registraties
        type: object
        list: { collapsible: { collapsed: true, summary: "{naam}" } }
        fields:
          - { name: logo, label: Logo, type: image }
          - { name: badge, label: Tekst in plaats van logo, type: string, description: "Bijv. AGB, als er geen logo is" }
          - { name: naam, label: Naam, type: string }
          - { name: tekst, label: Toelichting, type: string }
      - { name: praktijkKop, label: Kop boven de praktijk, type: string }
      - { name: praktijk, label: Over de praktijk (alinea's), type: text, list: true }
      - { name: adres, label: Adres, type: string }
      - { name: praktijkBeeld, label: Foto van de praktijk, type: image }

  # ---------------------------------------------------------------- Juridisch
  - name: juridisch
    label: Privacy, cookies & voorwaarden
    description: "Plekken met [[…]] moeten nog worden ingevuld. Laat de teksten daarna juridisch controleren."
    type: file
    path: docs/juridisch.json
    fields:
      - { name: _toelichting, label: Toelichting, type: string, hidden: true }
      - name: paginas
        label: Pagina's
        type: object
        list: { min: 3, max: 3, collapsible: { collapsed: true, summary: "{titel}" } }
        fields:
          - { name: slug, label: Adres (niet wijzigen), type: string, hidden: true }
          - { name: titel, label: Titel, type: string }
          - { name: kop, label: Kop, type: string, description: "Schuingedrukt deel tussen sterretjes" }
          - { name: intro, label: Intro, type: text }
          - name: secties
            label: Onderdelen
            type: object
            list: { collapsible: { collapsed: true, summary: "{kop}" } }
            fields:
              - { name: kop, label: Kop, type: string }
              - { name: tekst, label: Alinea's, type: text, list: true, description: "Vervang [[…]] door de juiste gegevens" }

